# 1) Replace YOUR-MANAGED-IDENTITY-CLIENT-ID with the User-assigned identity Client ID from Azure Portal.

# 2) az identity federated-credential create ... subject system:serviceaccount:default:dotnet-workload

# 3) kubectl apply -f serviceaccount-keyvault.yaml

apiVersion: v1

kind: ServiceAccount

metadata:

  name: dotnet-workload

  namespace: default

  annotations:

