apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-kv-spc
  namespace: default
spec:
  provider: azure
  secretObjects:
    - secretName: postgres-secret
      type: Opaque
      data:
        - objectName: postgres-user
          key: postgres-user
        - objectName: postgres-password
          key: postgres-password
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "217d243c-d7eb-420a-a2e2-605f61600266"
    keyvaultName: "TESTKEY12E"
    tenantId: "96d03780-7886-40ee-9fb8-cde57aa4d5ec"
    objects: |
      array:
        - |
          objectName: postgres-user
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
